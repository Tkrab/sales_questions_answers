{% extends "base.html" %}
{% block title %}登录 · 行业知识问答{% endblock %}
{% block content %}
<section class="auth">
  <div class="auth-copy">
    <p class="eyebrow">有色 · 钢铁</p>
    <h1>把标准答案记住，再用自己的话讲出来。</h1>
    <p>提交答案后，模型对照标准答案和评分要点打分，并写出评语。</p>
  </div>
  <form class="card form" method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <h2>登录</h2>
    {% include "quiz/_fields.html" %}
    <button class="btn" type="submit">进入题库</button>
    <p class="switch">还没有账号？<a href="{% url 'register' %}">注册</a></p>
  </form>
</section>
{% endblock %}
