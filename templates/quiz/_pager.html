{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pager" aria-label="分页">
    {% if page_obj.has_previous %}
      <a href="?page={{ page_obj.previous_page_number }}{{ pager_suffix }}">上一页</a>
    {% else %}
      <span>上一页</span>
    {% endif %}
    <strong>第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页</strong>
    {% if page_obj.has_next %}
      <a href="?page={{ page_obj.next_page_number }}{{ pager_suffix }}">下一页</a>
    {% else %}
      <span>下一页</span>
    {% endif %}
  </nav>
{% endif %}
